events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Centralized JSON Logging
    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"request_time":"$request_time",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    upstream auth_service { server auth-api:8000; }
    upstream user_service { server user-api:8000; }
    upstream product_service { server product-api:8000; }
    upstream order_service { server order-api:8000; }
    upstream payment_service { server payment-api:8000; }

    server {
        listen 80;

        # Return JSON error responses instead of HTML
        # Intercept all error responses
        error_page 401 = @error401;
        error_page 403 = @error403;
        error_page 404 = @error404;
        error_page 500 502 503 504 = @error50x;

        # Custom error handlers that return JSON
        location @error401 {
            default_type application/json;
            return 401 '{\"error\":\"Unauthorized\",\"message\":\"Authentication required. Please provide a valid access token.\",\"status\":401}';
        }

        location @error403 {
            default_type application/json;
            return 403 '{\"error\":\"Forbidden\",\"message\":\"You do not have permission to access this resource.\",\"status\":403}';
        }

        location @error404 {
            default_type application/json;
            return 404 '{\"error\":\"Not Found\",\"message\":\"The requested resource was not found.\",\"status\":404}';
        }

        location @error50x {
            default_type application/json;
            return 500 '{\"error\":\"Internal Server Error\",\"message\":\"An unexpected error occurred. Please try again later.\",\"status\":500}';
        }

        # Internal Auth Check
        location = /_auth_validate {
            internal;
            proxy_pass http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # --- HEALTH CHECKS (Public, No Auth) ---
        # Specific locations to override protected blocks

        location /auth/health {
            proxy_pass http://auth_service/auth/health;
        }

        location /user/health {
            proxy_pass http://user_service/user/health;
        }

        location /product/health {
            proxy_pass http://product_service/product/health;
        }

        location /order/health {
            proxy_pass http://order_service/order/health;
        }

        location /payment/health {
            proxy_pass http://payment_service/payment/health;
        }

        # --- API ROUTES ---

        # Auth Service (Public)
        location /auth {
            proxy_pass http://auth_service/auth;
        }

        # User Service (Protected)
        # Handles /users/addresses etc.
        location /users {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://user_service/users;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Product Service (Public)
        location /product {
            proxy_pass http://product_service/product;
        }
        
        location /products {
            proxy_pass http://product_service/products;
        }

        # Payment Service (Protected)
        location /pay {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://payment_service/pay;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /payments {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://payment_service/payments;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Order Service (Protected)
        location /order {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://order_service/order;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /orders {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://order_service/orders;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # --- SWAGGER/OPENAPI DOCS (Public) ---

        # Auth Docs
        location /docs/auth {
            proxy_pass http://auth_service/docs/auth;
        }
        location /openapi.json/auth {
            proxy_pass http://auth_service/openapi.json/auth;
        }

        # User Docs
        location /docs/user {
            proxy_pass http://user_service/docs/user;
        }
        location /openapi.json/user {
            proxy_pass http://user_service/openapi.json/user;
        }

        # Product Docs
        location /docs/product {
            proxy_pass http://product_service/docs/product;
        }
        location /openapi.json/product {
            proxy_pass http://product_service/openapi.json/product;
        }

        # Order Docs
        location /docs/order {
            proxy_pass http://order_service/docs/order;
        }
        location /openapi.json/order {
            proxy_pass http://order_service/openapi.json/order;
        }

        # Payment Docs
        location /docs/payment {
            proxy_pass http://payment_service/docs/payment;
        }
        location /openapi.json/payment {
            proxy_pass http://payment_service/openapi.json/payment;
        }
    }
}