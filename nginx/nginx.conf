# Nginx main configuration
user nginx;
worker_processes auto;

# Declare environment variables (makes them available to nginx)
# Note: These are for documentation - nginx has limited env var support
# Only CORS_ORIGIN is actually used via map directive
env CORS_ORIGIN;

events {
    worker_connections 256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Include modular configuration files
    include /etc/nginx/logging.conf;
    include /etc/nginx/env.defaults.conf;  # Environment variable defaults
    include /etc/nginx/performance.conf;
    include /etc/nginx/timeouts.conf;
    include /etc/nginx/security.conf;
    include /etc/nginx/cors.conf;
    include /etc/nginx/upstreams.conf;

    server {
        listen 80;

        # Include error handling configuration
        include /etc/nginx/errors.conf;

        # Internal auth validation endpoint
        location = /_auth_validate {
            internal;
            proxy_pass http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Include service-specific routes
        include /etc/nginx/services/auth.conf;
        include /etc/nginx/services/user.conf;
        include /etc/nginx/services/product.conf;
        include /etc/nginx/services/order.conf;
        include /etc/nginx/services/payment.conf;
    }
}
