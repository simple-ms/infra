events {
    worker_connections 1024;
}

http {
    # Define where the services are running (Docker service names)
    upstream user_service {
        server user-api:8000;
    }
    upstream product_service {
        server product-api:8000;
    }
    upstream order_service {
        server order-api:8000;
    }
    upstream payment_service {
        server payment-api:8000;
    }

    server {
        listen 80;

        # --- AUTHENTICATION SUB-REQUEST ---
        # This location is internal (cannot be called from outside)
        location = /_auth_validate {
            internal;
            proxy_pass http://user_service/validate-token;
            
            # We don't need to send the POST body to the auth service, just headers
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            
            # Pass the Authorization header to the auth service
            proxy_set_header Authorization $http_authorization;
        }

        # --- USER SERVICE (Public Routes) ---
        # Allow login/register without checking token
        location = /users/login {
            proxy_pass http://user_service/users/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location = /users/register {
            proxy_pass http://user_service/users/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # --- USER SERVICE (Protected Routes) ---
        # For other user routes (like password change, delete me), check auth
        location ~ ^/users/(password|me) {
            auth_request /_auth_validate;
            
            # Extract user info from auth response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            
            # Pass to user service
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header Authorization $http_authorization;
        }

        # --- PRODUCT SERVICE (Public for GET, Protected for POST) ---
        # GET requests are public
        location /product {
            # For GET requests, allow public access
            if ($request_method = GET) {
                proxy_pass http://product_service;
                break;
            }
            
            # For POST/PUT/DELETE, require auth
            auth_request /_auth_validate;
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # --- ORDER SERVICE (Protected) ---
        location /order {
            auth_request /_auth_validate;
            
            # Extract user ID from auth response
            auth_request_set $user_id $upstream_http_x_user_id;
            
            # Inject that header into the request sent to Order API
            proxy_set_header X-User-Id $user_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            
            proxy_pass http://order_service;
        }

        # --- PAYMENT SERVICE (Protected) ---
        location /pay {
            auth_request /_auth_validate;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # --- DOCUMENTATION ROUTING ---
        # Instead of merging, we expose them individually
        location /docs/user {
            proxy_pass http://user_service/docs;
            
            # 1. Disable compression so Nginx can read/edit the text
            proxy_set_header Accept-Encoding ""; 
            
            # 2. Replace the default schema URL with your specific Nginx route
            sub_filter '/openapi.json' '/openapi.json/user';
            sub_filter_once off;
            sub_filter_types *;
        }
        
        location /openapi.json/user {
            proxy_pass http://user_service/openapi.json;
        }
        
        location /docs/product {
            proxy_pass http://product_service/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/product';
            sub_filter_once off;
            sub_filter_types *;
        }
        
        location /openapi.json/product {
            proxy_pass http://product_service/openapi.json;
        }
        
        location /docs/order {
            proxy_pass http://order_service/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/order';
            sub_filter_once off;
            sub_filter_types *;
        }
        
        location /openapi.json/order {
            proxy_pass http://order_service/openapi.json;
        }
        
        location /docs/payment {
            proxy_pass http://payment_service/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/payment';
            sub_filter_once off;
            sub_filter_types *;
        }
        
        location /openapi.json/payment {
            proxy_pass http://payment_service/openapi.json;
        }
        
        # --- ROOT ENDPOINT ---
        location = / {
            return 200 '{"message": "Nginx API Gateway", "services": ["user", "product", "order", "payment"], "docs": ["/docs/user", "/docs/product", "/docs/order", "/docs/payment"]}';
            add_header Content-Type application/json;
        }
    }
}