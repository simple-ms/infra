events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Centralized JSON Logging
    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"request_time":"$request_time",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    upstream auth_service { server auth-api:8000; }
    upstream user_service { server user-api:8000; }
    upstream product_service { server product-api:8000; }
    upstream order_service { server order-api:8000; }
    upstream payment_service { server payment-api:8000; }

    server {
        listen 80;

        # Internal Auth Check
        location = /_auth_validate {
            internal;
            proxy_pass http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Auth Service (Public)
        location /auth {
            proxy_pass http://auth_service/auth;
        }

        # User Service (Protected)
        location /users {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://user_service/users;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Product Service (GET Public, Others Protected)
        location /product {
            if ($request_method = GET) {
                proxy_pass http://product_service/product;
                break;
            }

            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://product_service/product;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Order Service (Protected)
        location /order {
            auth_request /_auth_validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://order_service/order;
            proxy_set_header X-User-Id $user_id;
        }

        # Docs Rewrites
        location /docs/auth {
            proxy_pass http://auth_service/docs/auth;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/auth';
            sub_filter_once off;
        }
        location /openapi.json/auth { proxy_pass http://auth_service/openapi.json/auth; }

        location /docs/user {
            proxy_pass http://user_service/docs/user;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/user';
            sub_filter_once off;
        }
        location /openapi.json/user { proxy_pass http://user_service/openapi.json/user; }

        location /docs/product {
            proxy_pass http://product_service/docs/product;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/product';
            sub_filter_once off;
        }
        location /openapi.json/product { proxy_pass http://product_service/openapi.json/product; }

        location /docs/order {
            proxy_pass http://order_service/docs/order;
            proxy_set_header Accept-Encoding "";
            sub_filter '/openapi.json' '/openapi.json/order';
            sub_filter_once off;
        }
        location /openapi.json/order { proxy_pass http://order_service/openapi.json/order; }
    }
}