# ===========================================
# PERFORMANCE & SECURITY CONFIGURATION
# ===========================================

# Rate limiting zones
# Note: limit_req_zone doesn't support variables, must be hardcoded
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=50r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Request size limits
client_max_body_size 10M;
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;

# Gzip compression
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
gzip_proxied any;
gzip_disable "msie6";

# Keepalive
keepalive_timeout 65s;
keepalive_requests 100;
