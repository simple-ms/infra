# Custom JSON error responses
error_page 401 = @error401;
error_page 403 = @error403;
error_page 404 = @error404;
error_page 500 502 503 504 = @error50x;

location @error401 {
    default_type application/json;
    return 401 '{"error":"Unauthorized","message":"Authentication required. Please provide a valid access token.","status":401}';
}

location @error403 {
    default_type application/json;
    return 403 '{"error":"Forbidden","message":"You do not have permission to access this resource.","status":403}';
}

location @error404 {
    default_type application/json;
    return 404 '{"error":"Not Found","message":"The requested resource was not found.","status":404}';
}

location @error50x {
    default_type application/json;
    return 500 '{"error":"Internal Server Error","message":"An unexpected error occurred. Please try again later.","status":500}';
}
