# Environment variable defaults using map directive
# Note: Nginx has LIMITED env var support
# - CORS origin works (used in map)
# - Service hosts/ports DON'T work in upstream blocks
# - Rate limits DON'T work in limit_req_zone
#
# For Kubernetes: Change upstreams.conf to use K8s service DNS

# CORS origin (this actually works!)
map $CORS_ORIGIN $cors_allowed_origin {
    default "http://localhost:5173";
}
