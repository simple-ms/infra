# ===========================================
# AUTH SERVICE ROUTES
# ===========================================

# Public endpoints (no auth required)
location /auth {
    # Rate limiting for auth endpoints (prevent brute force)
    limit_req zone=auth_limit burst=20 nodelay;
    limit_conn conn_limit 10;
    
    # Handle CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' '0';
        return 204;
    }
    
    proxy_pass http://auth_service/auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS headers for ALL responses including errors
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
}

# Health check
location /auth/health {
    proxy_pass http://auth_service/auth/health;
}

# API Documentation
location /docs/auth {
    proxy_pass http://auth_service/docs/auth;
}

location /openapi.json/auth {
    proxy_pass http://auth_service/openapi.json/auth;
}
