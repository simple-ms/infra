# ===========================================
# USER SERVICE ROUTES
# ===========================================

# All user endpoints require authentication
location /users {
    # Handle CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' '0';
        return 204;
    }
    
    # Validate auth and extract user info
    auth_request /_auth_validate;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    
    proxy_pass http://user_service/users;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-Id $user_id;
    proxy_set_header X-User-Role $user_role;
    
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
}

# Health check
location /user/health {
    proxy_pass http://user_service/user/health;
}

# API Documentation
location /docs/user {
    proxy_pass http://user_service/docs/user;
}

location /openapi.json/user {
    proxy_pass http://user_service/openapi.json/user;
}
