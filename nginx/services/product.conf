# Health check
location /product/health {
    proxy_pass http://product_service/product/health;
}

# API Documentation
location /docs/product {
    proxy_pass http://product_service/docs/product;
}

location /openapi.json/product {
    proxy_pass http://product_service/openapi.json/product;
}
