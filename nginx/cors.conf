# ===========================================
# CORS Configuration - Secure Whitelist Approach
# ===========================================

# Define allowed origins - ONLY these origins will be allowed
# Requests from non-whitelisted origins will NOT receive CORS headers
map $http_origin $cors_origin {
    # Development origins
    "http://localhost:3000"   $http_origin;
    "http://localhost:8080"   $http_origin;
    "http://127.0.0.1:3000"   $http_origin;
    "http://127.0.0.1:8080"   $http_origin;
    "http://127.0.0.1:5173"   $http_origin;
    "http://localhost:5173"   $http_origin;
    
    # Production origins (add your production domain here)
    # "https://yourdomain.com"  $http_origin;
    # "https://app.yourdomain.com" $http_origin;
    
    # Default: empty string (no CORS headers will be added)
    default "";
}

# Validate if origin is allowed (returns "true" if allowed, empty if not)
map $http_origin $cors_allowed {
    "http://localhost:3000"   "true";
    "http://localhost:8080"   "true";
    "http://127.0.0.1:3000"   "true";
    "http://127.0.0.1:8080"   "true";
    "http://127.0.0.1:5173"   "true";
    "http://localhost:5173"   "true";
    default "";
}
