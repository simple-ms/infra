# CORS: Map allowed origins for frontend access
map $http_origin $cors_origin {
    "http://localhost:8080" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:8080" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://0.0.0.0:8080" $http_origin;
    "http://0.0.0.0:3000" $http_origin;
    "http://0.0.0.0:*" $http_origin;
    "http://localhost:*" $http_origin;
    default "";
}
