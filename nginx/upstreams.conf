# Service upstreams - using hardcoded values
# Note: upstream directive doesn't support variables
# For dynamic service discovery, we use proxy_pass with variables in location blocks

upstream auth_service {
    server auth-api:8000;
    keepalive 32;
}

upstream user_service {
    server user-api:8000;
    keepalive 32;
}

upstream product_service {
    server product-api:8000;
    keepalive 32;
}

upstream order_service {
    server order-api:8000;
    keepalive 32;
}

upstream payment_service {
    server payment-api:8000;
    keepalive 32;
}
