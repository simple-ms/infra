services:
  # Frontend Service - COMMENTED OUT (focusing on backend deployment)
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: frontend
  #   working_dir: /app
  #   volumes:
  #     - ../frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - auth-api
  #     - user-api
  #     - product-api
  #     - order-api
  #     - payment-api

  # API Tester - Simple HTML interface to test backend
  api-tester:
    build:
      context: ../api-tester
      dockerfile: Dockerfile
    container_name: api-tester
    ports:
      - "5173:5173"
    depends_on:
      - nginx-gateway

  # --- GATEWAY ---
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cors.conf:/etc/nginx/cors.conf:ro
      - ./nginx/upstreams.conf:/etc/nginx/upstreams.conf:ro
      - ./nginx/errors.conf:/etc/nginx/errors.conf:ro
    depends_on:
      - auth-api
      - user-api
      - product-api
      - order-api
      - payment-api

  # --- KAFKA (KRaft Mode) ---
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
      KAFKA_LOG_DIRS: "/tmp/kraft-storage"
      # Single-broker configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      retries: 10

  # --- REDIS ---
  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    # volumes:
    #   - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- PGADMIN ---
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: sabuhi@mail.com
  #     PGADMIN_DEFAULT_PASSWORD: sabuhi123
  #   container_name: pgadmin
  #   ports:
  #     - "5050:80"
  #   # volumes:
  #   #   - pgadmin_data:/var/lib/pgadmin

  # --- DATABASES ---
  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  user-db:
    image: postgres:17
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  order-db:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  payment-db:
    image: postgres:17
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # --- SERVICES ---
  auth-api:
    build:
      context: ../auth
      dockerfile: Dockerfile.local
    container_name: auth-api
    image: auth-api
    volumes:
      - ../auth/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${AUTH_DB_PASSWORD:-postgres}@auth-db:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-3}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
    depends_on:
      auth-db:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  user-api:
    build:
      context: ../user
      dockerfile: Dockerfile.local
    container_name: user-api
    image: user-api
    volumes:
      - ../user/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${USER_DB_PASSWORD:-postgres}@user-db:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  product-api:
    build:
      context: ../product
      dockerfile: Dockerfile.local
    container_name: product-api
    image: product-api
    volumes:
      - ../product/app:/app/app
      # - ../product/entrypoint-seed.sh:/app/entrypoint-seed.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${PRODUCT_DB_PASSWORD:-postgres}@product-db:5432/product_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # entrypoint: ["/bin/bash", "-c", "/app/entrypoint-seed.sh && ./entrypoint.sh"]
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  order-api:
    build:
      context: ../order
      dockerfile: Dockerfile.local
    container_name: order-api
    image: order-api
    volumes:
      - ../order/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${ORDER_DB_PASSWORD:-postgres}@order-db:5432/order_db
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://product-api:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  payment-api:
    build:
      context: ../payment
      dockerfile: Dockerfile.local
    container_name: payment-api
    image: payment-api
    volumes:
      - ../payment/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${PAYMENT_DB_PASSWORD:-postgres}@payment-db:5432/payment_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  # --- CELERY WORKERS & BEAT SCHEDULERS ---
  
  # Auth Service Celery Worker
  auth-celery-worker:
    image: auth-api
    container_name: auth-celery-worker
    volumes:
      - ../auth/app:/app/app
      - ../auth/entrypoint-celery.sh:/app/entrypoint-celery.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${AUTH_DB_PASSWORD:-postgres}@auth-db:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-3}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/entrypoint-celery.sh"]
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q auth-tasks
  
  # Auth Service Celery Beat (Scheduler)
  auth-celery-beat:
    image: auth-api
    container_name: auth-celery-beat
    volumes:
      - ../auth/app:/app/app
      - ../auth/entrypoint-celery.sh:/app/entrypoint-celery.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${AUTH_DB_PASSWORD:-postgres}@auth-db:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-3}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/app/entrypoint-celery.sh"]
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
  
  # Order Service Celery Worker
  order-celery-worker:
    image: order-api
    container_name: order-celery-worker
    volumes:
      - ../order/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${ORDER_DB_PASSWORD:-postgres}@order-db:5432/order_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q order-tasks
  
  # Order Service Celery Beat (Scheduler)
  order-celery-beat:
    image: order-api
    container_name: order-celery-beat
    volumes:
      - ../order/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${ORDER_DB_PASSWORD:-postgres}@order-db:5432/order_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # Order Service Kafka Consumer
  order-kafka-consumer:
    image: order-api
    container_name: order-kafka-consumer
    volumes:
      - ../order/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${ORDER_DB_PASSWORD:-postgres}@order-db:5432/order_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: python -m app.run_consumer
