services:
  # --- GATEWAY ---
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-api
      - user-api
      - product-api
      - order-api
      - payment-api

  # --- KAFKA (KRaft Mode) ---
  kafka:
    image: bitnami/kafka:3.5
    container_name: kafka
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      retries: 10

  # --- DATABASES ---
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # --- SERVICES ---
  auth-api:
    build:
      context: ../auth
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@auth-db:5432/auth_db
      JWT_SECRET_KEY: "super-secret-key"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRATION_MINUTES: "15"     # Short Access Token
      JWT_REFRESH_EXPIRATION_DAYS: "7" # Long Refresh Token
    depends_on:
      auth-db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  user-api:
    build:
      context: ../user
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@user-db:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  product-api:
    build:
      context: ../product
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@product-db:5432/product_db
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  order-api:
    build:
      context: ../order
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@order-db:5432/order_db
      PRODUCT_API_URL: "http://product-api:8000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  payment-api:
    build:
      context: ../payment
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@payment-db:5432/payment_db
    depends_on:
      payment-db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"